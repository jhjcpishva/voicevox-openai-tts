[project]
name = "voicevox-openai-tts"
version = "0.3.4"
description = "OpenAI-compatible TTS bridge for VOICEVOX and AivisSpeech"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "lameenc>=1.9.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[project.optional-dependencies]
example = [
    "loguru>=0.7.3",
    "openai>=3.41.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pylint>=4.1.3",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

# [project.scripts]

[tool.uv.build-backend]
module-root = "src"
module-name = "voicevox_openai_tts"

[tool.pylint]
# lint only unsupported features on py313
disable = ["all"]
enable = ["F", "E"]
py-version = "3.13"
ignored-modules = []
ignore-paths = []

[tool.pylint.'MESSAGES CONTROL']
extension-pkg-whitelist = "pydantic"

[tool.ruff]
extend-include = []
extend-exclude = []
# Assume Python 3.13
target-version = "py313"

[tool.ruff.format]
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# Same as pyupgrade
extend-select = ["UP", "D"]
ignore = [
    "F",
    "E",
    "D1",
    "D200",
    "D205",
    "D212",
    "D415",
]
unfixable = ["D"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
